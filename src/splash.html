<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepSeek Harness</title>
<style>
  :root {
    /* The wordmark fill: the same static blue ramp the mobile splash paints
       with SVG (#b9c6ff → #6a7ad6). Nothing here animates the fill itself. */
    --fill-top: #b9c6ff;
    --fill-bottom: #6a7ad6;
    --sweep-ms: 2400ms;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── the wordmark: "Made by xxccdl", centred on black, nothing else ──
     Two identical copies sit on top of each other. The lower one carries the
     static blue fill; the upper one carries the light band and is clipped to the
     very same glyphs, so the light only ever travels inside the strokes — the
     CSS twin of the mobile splash's ClipPath over the SVG wordmark. */
  .wordmark {
    position: relative;
    white-space: nowrap;
    line-height: 1;
    font-size: 40px;
    letter-spacing: 0.01em;
  }
  .wordmark .by { font-size: 0.55em; font-style: italic; font-weight: 300; }
  .wordmark .name { font-size: 1em; font-weight: 600; }
  .wordmark > span {
    display: block;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .fill {
    background-image: linear-gradient(180deg, var(--fill-top) 0%, var(--fill-bottom) 100%);
  }
  .sheen {
    position: absolute;
    inset: 0;
    /* The band itself: transparent at both ends, bright white in the middle. */
    background-image: linear-gradient(90deg,
      rgba(255, 255, 255, 0) 0%,
      rgba(255, 255, 255, 0) 42%,
      rgba(255, 255, 255, 0.95) 50%,
      rgba(255, 255, 255, 0) 58%,
      rgba(255, 255, 255, 0) 100%);
    background-size: 260% 100%;
    background-repeat: no-repeat;
    animation: sweep var(--sweep-ms) cubic-bezier(.45, .05, .55, .95) infinite;
  }
  /* 100% → 0% walks the band from the left of the wordmark to the right of it,
     then restarts. Both ends of the band are already fully transparent, so the
     loop has no visible seam. */
  @keyframes sweep {
    from { background-position: 100% 0; }
    to   { background-position: 0 0; }
  }
</style>
</head>
<body>
  <div class="wordmark">
    <span class="fill"><span class="by">Made by</span> <span class="name">xxccdl</span></span>
    <span class="sheen" aria-hidden="true"><span class="by">Made by</span> <span class="name">xxccdl</span></span>
  </div>
</body>
</html>
